category: alarm
title: Alarm — 활성/이력/통계
scope: |
  알람 도메인 — 현재 활성 알람, severity 분포, 이력 검색, 통계.
expected_tools:
  - query_active_alarms
  - query_alarm_statistics
  - query_event

seed:
  - id: alm-01
    query: 현재 발생 중인 알람을 심각도별로 정리해줘. Critical 이나 Fatal 알람 있으면 리소스명, 발생 시간도 같이
    difficulty: easy
    expected:
      form: table
      tool_pattern: "query_active_alarms (group_by=severity)"

  - id: alm-02
    query: 오늘 발생한 알람 통계 (심각도별 + 시간대별)
    difficulty: medium
    expected:
      form: chart
      tool_pattern: "query_alarm_statistics (time=today, group_by=[severity, hour])"

  - id: alm-03
    query: promaxgb10-554c 서버에 발생한 최근 알람 5건
    difficulty: easy
    expected:
      form: table
      tool_pattern: "query_active_alarms (resource_filter=promaxgb10-554c, top_n=5)"

  - id: alm-04
    query: 최근 1시간 동안 발생한 Critical 알람 모두
    difficulty: medium
    expected:
      form: table
      tool_pattern: "query_active_alarms (severity=Critical, window=1h)"

  - id: alm-05
    query: 알람이 가장 많이 발생한 리소스 top 5
    difficulty: medium
    expected:
      form: table
      tool_pattern: "query_alarm_statistics (group_by=resource, top_n=5)"

  - id: alm-06
    query: 이벤트 로그 최근 10건
    difficulty: easy
    expected:
      form: table
      tool_pattern: "query_event (mode=list, top_n=10)"

  - id: alm-07
    query: 어제 발생한 알람 중 자동 해제된 것
    difficulty: hard
    expected:
      form: table
      tool_pattern: "query_active_alarms (time=어제, status=resolved)"

  - id: alm-08
    query: 같은 알람이 반복 발생한 패턴
    difficulty: hard
    expected:
      form: table
      tool_pattern: "query_alarm_statistics (pattern=repeated)"

expand_hints: |
  - severity 한국어 표현: Critical / Fatal / Major / Minor / Warning / Info
  - 시간 표현 다양화: "최근 N분", "어제", "지난 주", "오늘 오후 3시부터"
