category: nms
title: NMS — Network Management System
scope: |
  네트워크 장비 (스위치/라우터/방화벽) 와 인터페이스 도메인.
expected_tools:
  - query_nms_devices
  - query_nms_interfaces

seed:
  - id: nms-01
    query: 등록된 네트워크 장비 목록
    difficulty: easy
    expected:
      form: table
      tool_pattern: "query_nms_devices (mode=list)"

  - id: nms-02
    query: 네트워크 트래픽 상위 5개 장비
    difficulty: easy
    expected:
      form: table
      tool_pattern: "query_nms_devices (mode=top, metric=traffic)"

  - id: nms-03
    query: 인터페이스 utilization 80% 넘는 것
    difficulty: medium
    expected:
      form: table
      tool_pattern: "query_nms_interfaces (threshold=80, metric=utilization)"

  - id: nms-04
    query: DOWN 상태의 인터페이스
    difficulty: easy
    expected:
      form: table
      tool_pattern: "query_nms_interfaces (status_filter=DOWN)"

  - id: nms-05
    query: 최근 1시간 네트워크 트래픽 추이
    difficulty: medium
    expected:
      form: chart
      tool_pattern: "query_metric_timeseries (domain=nms, window=1h)"

expand_hints: |
  - 장비 이름 / IP 는 alias resolve
  - dev 환경에 NMS agent 등록 여부 확인 필요
