---
- name: SMS disabled notice
  ansible.builtin.debug:
    msg: "SMS agent disabled (sms_enabled=false)"
  when: not (sms_enabled | default(true))

# Host-level systemd agent: pre-detect to skip when already installed.
# Other 3 agents are namespace-isolated (K8s pod / DaemonSet) so this guard
# only applies to SMS.
- name: Detect existing SMS agent (host-level systemd / process)
  ansible.builtin.shell: |
    set +e
    PROC=$(pgrep -af sms-agent | grep -v grep | head -1)
    SVC=$(systemctl is-active sms-agent 2>/dev/null)
    if [ -n "$PROC" ] || [ "$SVC" = "active" ]; then
      echo "FOUND proc='$PROC' service='$SVC'"
      exit 0
    fi
    exit 1
  register: sms_existing
  changed_when: false
  failed_when: false

- name: SMS already installed — skip install (set sms_force_reinstall=true to override)
  ansible.builtin.debug:
    msg: >
      SMS agent already present on host — install skipped.
      Detection: {{ (sms_existing.stdout | default('')) | trim }}
  when:
    - sms_enabled | default(true)
    - sms_existing.rc == 0
    - not (sms_force_reinstall | default(false))

- name: ARM only — install qemu-user-static + binfmt-support
  ansible.builtin.apt:
    name: [qemu-user-static, binfmt-support]
    state: present
    update_cache: true
  when:
    - sms_enabled | default(true)
    - target_arch == 'arm64'
    - ansible_os_family == 'Debian'
    - (sms_existing.rc != 0) or (sms_force_reinstall | default(false))

- name: ARM only — verify binfmt registration
  ansible.builtin.command: ls /proc/sys/fs/binfmt_misc/
  register: binfmt_ls
  changed_when: false
  when:
    - sms_enabled | default(true)
    - target_arch == 'arm64'
    - (sms_existing.rc != 0) or (sms_force_reinstall | default(false))
  failed_when:
    - sms_enabled | default(true)
    - target_arch == 'arm64'
    - (sms_existing.rc != 0) or (sms_force_reinstall | default(false))
    - "'qemu-x86_64' not in (binfmt_ls.stdout | default(''))"
    - "'qemu-amd64' not in (binfmt_ls.stdout | default(''))"

- name: Install SMS agent (PAT configured + not already present)
  when:
    - sms_enabled | default(true)
    - github_pat | length > 0
    - (sms_existing.rc != 0) or (sms_force_reinstall | default(false))
  block:
    - name: Ensure SMS install dir
      ansible.builtin.file:
        path: "{{ sms_install_dir }}"
        state: directory
        mode: '0755'

    - name: Fetch SMS release metadata (private repo via API)
      ansible.builtin.uri:
        url: "{{ agent_release_api_base }}/releases/tags/{{ sms_release_tag }}"
        headers:
          Authorization: "Bearer {{ github_pat }}"
          Accept: "application/vnd.github+json"
        return_content: true
      register: sms_release_meta
      no_log: true

    - name: Resolve SMS asset id
      ansible.builtin.set_fact:
        sms_asset_id: "{{ (sms_release_meta.json.assets | selectattr('name', 'equalto', sms_asset_name) | map(attribute='id') | list | first) }}"

    - name: Download SMS tarball (octet-stream)
      ansible.builtin.get_url:
        url: "{{ agent_release_api_base }}/releases/assets/{{ sms_asset_id }}"
        headers:
          Authorization: "Bearer {{ github_pat }}"
          Accept: "application/octet-stream"
        dest: "/tmp/{{ sms_asset_name }}"
        mode: '0644'
      register: sms_dl
      retries: 5
      delay: 10
      until: sms_dl is succeeded
      no_log: true

    - name: Extract SMS tarball
      ansible.builtin.unarchive:
        src: "/tmp/{{ sms_asset_name }}"
        dest: "{{ sms_install_dir }}"
        remote_src: true

    - name: Locate SMS agent binary
      ansible.builtin.shell: |
        find {{ sms_install_dir }} -type f -name 'sms-agent*' -executable 2>/dev/null \
          | head -1 \
          || find {{ sms_install_dir }} -maxdepth 4 -type f -name 'sms-agent*' 2>/dev/null | head -1
      register: sms_binary_path
      changed_when: false

    - name: Render SMS config
      ansible.builtin.template:
        src: sms-config.yaml.j2
        dest: "{{ sms_install_dir }}/agent-config.yaml"
        mode: '0644'
      notify: restart sms-agent

    - name: Render SMS systemd unit
      ansible.builtin.template:
        src: sms-agent.service.j2
        dest: /etc/systemd/system/sms-agent.service
        mode: '0644'
      notify: restart sms-agent

    - name: Enable + start SMS agent
      ansible.builtin.systemd:
        name: sms-agent
        enabled: true
        state: started
        daemon_reload: true

- name: SMS skip notice (GITHUB_PAT not set + not installed)
  ansible.builtin.debug:
    msg: "SMS agent skipped — set GITHUB_PAT env var on the controller to download from polestar-agents-binaries."
  when:
    - sms_enabled | default(true)
    - github_pat | length == 0
    - sms_existing.rc != 0
