---
- name: SMS disabled notice
  ansible.builtin.debug:
    msg: "SMS agent disabled (sms_enabled=false)"
  when: not (sms_enabled | default(true))

# 109 reference shows actual daemon names are MAGENTL/SMSAGENTL (not SMSAGENT/MAGENT).
# Polestar SMS uses agentstart.sh -> magentctl -start to fork daemons; no systemd unit.
- name: Detect existing Polestar SMS daemons
  ansible.builtin.shell: |
    set +e
    PROC=$(pgrep -af 'SMSAGENTL|MAGENTL|PARFT' | grep -v grep | head -1)
    if [ -n "$PROC" ]; then
      echo "FOUND $PROC"
      exit 0
    fi
    exit 1
  register: sms_existing
  changed_when: false
  failed_when: false

- name: SMS already running — skip install (set sms_force_reinstall=true to override)
  ansible.builtin.debug:
    msg: >
      SMS daemons already running on host — install skipped.
      Detection: {{ (sms_existing.stdout | default('')) | trim }}
  when:
    - sms_enabled | default(true)
    - sms_existing.rc == 0
    - not (sms_force_reinstall | default(false))

- name: ARM only — install qemu-user-static + binfmt-support + amd64 libs
  ansible.builtin.apt:
    name:
      - qemu-user-static
      - binfmt-support
      - libc6:amd64           # x86_64 dynamic linker for qemu-binfmt
      - libstdc++6:amd64
    state: present
    # update_cache handled tolerantly in arm-sms-prereq; avoids third-party
    # repo errors (e.g. NVIDIA expired GPG on 109) blocking the install.
  when:
    - sms_enabled | default(true)
    - target_arch == 'arm64'
    - ansible_os_family == 'Debian'
    - (sms_existing.rc != 0) or (sms_force_reinstall | default(false))

- name: ARM only — verify binfmt registration
  ansible.builtin.command: ls /proc/sys/fs/binfmt_misc/
  register: binfmt_ls
  changed_when: false
  when:
    - sms_enabled | default(true)
    - target_arch == 'arm64'
    - (sms_existing.rc != 0) or (sms_force_reinstall | default(false))
  failed_when:
    - sms_enabled | default(true)
    - target_arch == 'arm64'
    - (sms_existing.rc != 0) or (sms_force_reinstall | default(false))
    - "'qemu-x86_64' not in (binfmt_ls.stdout | default(''))"
    - "'qemu-amd64' not in (binfmt_ls.stdout | default(''))"

- name: Install SMS agent via Polestar AgentInstall.sh + agentstart.sh
  when:
    - sms_enabled | default(true)
    - github_pat | length > 0
    - (sms_existing.rc != 0) or (sms_force_reinstall | default(false))
  block:
    - name: Ensure SMS install dir
      ansible.builtin.file:
        path: "{{ sms_install_dir }}"
        state: directory
        mode: '0755'

    - name: Fetch SMS release metadata (private repo via API)
      ansible.builtin.uri:
        url: "{{ agent_release_api_base }}/releases/tags/{{ sms_release_tag }}"
        headers:
          Authorization: "Bearer {{ github_pat }}"
          Accept: "application/vnd.github+json"
        return_content: true
      register: sms_release_meta
      no_log: true

    - name: Resolve SMS asset id
      ansible.builtin.set_fact:
        sms_asset_id: "{{ (sms_release_meta.json.assets | selectattr('name', 'equalto', sms_asset_name) | map(attribute='id') | list | first) }}"

    - name: Download SMS tarball (octet-stream)
      ansible.builtin.get_url:
        url: "{{ agent_release_api_base }}/releases/assets/{{ sms_asset_id }}"
        headers:
          Authorization: "Bearer {{ github_pat }}"
          Accept: "application/octet-stream"
        dest: "/tmp/{{ sms_asset_name }}"
        mode: '0644'
      register: sms_dl
      retries: 5
      delay: 10
      until: sms_dl is succeeded
      no_log: true

    - name: Extract SMS tarball
      ansible.builtin.unarchive:
        src: "/tmp/{{ sms_asset_name }}"
        dest: "{{ sms_install_dir }}"
        remote_src: true

    - name: Run Polestar AgentInstall.sh (config + binfmt registration)
      ansible.builtin.command:
        cmd: /bin/sh ./AgentInstall.sh -m {{ polestar10_collector_host }}
        chdir: "{{ sms_install_dir }}"
      register: sms_install_run
      changed_when: sms_install_run.rc == 0

    # AgentInstall.sh fills Brokerinfo.conf with the local interface IP
    # (which is the lima NAT-internal IP behind a Mac, unreachable from broker)
    # and mosquitto/mosquitto credentials. The 109 reference shows working
    # config uses NULL for AGENT_IP/USER_ID/USER_PWD — broker derives the
    # source IP from the connection itself, and emqx accepts anonymous.
    - name: Patch Brokerinfo.conf — match 109 reference (NULL agent_ip + null creds)
      ansible.builtin.lineinfile:
        path: "{{ sms_install_dir }}/NNPAgent/MAgent/conf/Brokerinfo.conf"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: BROKER1_AGENT_IP, value: 'NULL' }   # quote → string 'NULL', not Python None
        - { key: BROKER1_USER_ID, value: 'NULL' }
        - { key: BROKER1_USER_PWD, value: 'NULL' }
      register: broker_conf_patch

    # 109's agentstart.sh hardcodes /home/nkia/NNPAgent-sms/... so it can't be
    # reused verbatim from a different install dir. Bypass it and call
    # magentctl directly — that's the actual entry point. MAgent forks
    # SMSAGENTL when it starts.
    #
    # Polestar bundles its own libssl/libcrypto/libstdc++ in NNPAgent/LIB/
    # because the daemon binaries are linked against specific versions.
    # Without LD_LIBRARY_PATH the qemu-binfmt loader can't resolve libssl.so.3.
    # If Brokerinfo.conf was patched (or this is fresh), make sure any old
    # daemon is stopped so it picks up the new conf on next start.
    - name: Stop magentctl if running (so it reloads patched conf)
      ansible.builtin.command: ./magentctl -stop
      args:
        chdir: "{{ sms_install_dir }}/NNPAgent/MAgent/bin"
      environment:
        LD_LIBRARY_PATH: "{{ sms_install_dir }}/NNPAgent/LIB"
      register: magentctl_stop
      changed_when: magentctl_stop.rc == 0
      failed_when: false
      when: broker_conf_patch is changed

    - name: Start Polestar Master Agent (magentctl -start; forks SMSAGENTL)
      ansible.builtin.command: ./magentctl -start
      args:
        chdir: "{{ sms_install_dir }}/NNPAgent/MAgent/bin"
      environment:
        LD_LIBRARY_PATH: "{{ sms_install_dir }}/NNPAgent/LIB"
      register: magentctl_run
      changed_when: magentctl_run.rc == 0

    - name: Verify SMS daemons started
      ansible.builtin.shell: |
        set +e
        pgrep -af 'SMSAGENTL|MAGENTL' | grep -v grep | head -3
      register: sms_verify
      changed_when: false
      failed_when: sms_verify.stdout | length == 0
      retries: 6
      delay: 5
      until: sms_verify.stdout | length > 0

- name: SMS skip notice (GITHUB_PAT not set + not running)
  ansible.builtin.debug:
    msg: "SMS agent skipped — set GITHUB_PAT (or 'gh auth login') on the controller."
  when:
    - sms_enabled | default(true)
    - github_pat | length == 0
    - sms_existing.rc != 0
