---
# rca-scenario-runner: 장애 시나리오 실행 웹 서비스 (FastAPI + React, Docker compose)
# 109 (또는 다른 타겟) 에 docker-compose 로 단일 컨테이너 띄움.
# testbed-build 스킬이 진정한 end-to-end 동작하려면 본 role 이 필요 —
# 사용자가 별도로 ssh 들어가서 띄우는 수동 단계 제거.

- name: scenario-runner — 활성화 여부 확인
  ansible.builtin.debug:
    msg: "scenario-runner deploy enabled (port={{ scenario_runner_port | default('8091') }})"
  when: scenario_runner_enabled | default(true)

- name: scenario-runner — 부재 시 git clone
  ansible.builtin.git:
    repo: "{{ scenario_runner_repo_url }}"
    dest: "{{ scenario_runner_install_dir }}"
    version: "{{ scenario_runner_branch | default('main') }}"
    force: false   # 기존 로컬 변경 보존
  become: false   # nkia user 의 home 에 clone (root 아님)
  when:
    - scenario_runner_enabled | default(true)
    - scenario_runner_repo_url | length > 0
  register: runner_clone

- name: scenario-runner — 기존 clone 이면 git pull
  ansible.builtin.command:
    cmd: "git pull --ff-only origin {{ scenario_runner_branch | default('main') }}"
    chdir: "{{ scenario_runner_install_dir }}"
  become: false
  when:
    - scenario_runner_enabled | default(true)
    - runner_clone is defined
    - not runner_clone.changed
  changed_when: false   # idempotent (no rebuild trigger if already up-to-date)
  register: runner_pull
  failed_when:
    - runner_pull.rc != 0
    - "'Already up to date' not in runner_pull.stdout"
    - "'CONFLICT' in runner_pull.stdout"

- name: scenario-runner — .env 작성 (build-and-deploy.sh 가 source)
  ansible.builtin.copy:
    dest: "{{ scenario_runner_install_dir }}/.env"
    mode: "0644"
    content: |
      # Auto-generated by ansible (testbed-build orchestrator).
      # 직접 편집 시 다음 ansible 실행 시 덮어쓰기 됨.
      PORT={{ scenario_runner_port | default(8091) }}
      SCRIPTS_HOST_PATH=./scenarios/services/{{ app_subdir }}/scripts
      # docker-compose 가 scenarios/services/${TESTBED_NAME}/ 만 mount → multi-testbed ID 충돌 회피.
      TESTBED_NAME={{ app_subdir }}
      LOGS_HOST_PATH=./logs
      # testbed 별 별 kubeconfig 사용 (cluster_kind=k3d 의 testbed-별 cluster).
      # rca-scenario-runner 의 docker-compose 가 KUBECONFIG_HOST_PATH 디렉토리를 mount.
      KUBECONFIG_HOST_PATH={{ kubeconfig_path | dirname }}
      KUBECONFIG_FILE={{ kubeconfig_path | basename }}
      # testbed 별 별 docker-compose project (concurrent testbed 격리)
      COMPOSE_PROJECT_NAME=rca-scenario-runner-{{ cluster_name }}
  become: false
  when:
    - scenario_runner_enabled | default(true)

- name: scenario-runner — Docker daemon 활성 확인 (common role 가 깔았어야 함)
  ansible.builtin.systemd:
    name: docker
    state: started
  when: scenario_runner_enabled | default(true)

- name: scenario-runner — build-and-deploy.sh 실행 권한
  ansible.builtin.file:
    path: "{{ scenario_runner_install_dir }}/build-and-deploy.sh"
    mode: "0755"
  become: false
  when: scenario_runner_enabled | default(true)

# stale .applied_rev sentinel 제거 — 이전 run 의 sentinel 이 남아있으면
# build-and-deploy.sh 가 "이미 적용됨" 으로 판단하고 skip → 재배포 안 됨.
# 매번 새로 적용되도록 sentinel 강제 제거 (ansible 호출 = 명시적 의도).
- name: scenario-runner — stale .applied_rev sentinel 제거 (chicken-and-egg fix)
  ansible.builtin.file:
    path: "{{ scenario_runner_install_dir }}/.applied_rev"
    state: absent
  become: false
  when: scenario_runner_enabled | default(true)

# 신규 testbed 의 첫 배포 시 service-spec.yaml + scripts/ 부재 → build-and-deploy.sh
# 의 N>0 검사로 fail. testbed-build 의 Phase 10 (시나리오 생성) 이 본 role 호출 전에
# 실행되어야 함. SKILL.md Phase 8 → 10 → scenario-runner role 순서로 명시.
# stub placeholder 만 미리 만들어 build-and-deploy.sh 가 통과하게 — Phase 10 에서
# 실제 시나리오 채워지면 다음 호출에 자동 발견.
- name: scenario-runner — service-spec / scripts 디렉토리 stub 생성 (없는 경우만)
  ansible.builtin.file:
    path: "{{ scenario_runner_install_dir }}/scenarios/services/{{ app_subdir }}/scripts"
    state: directory
    mode: "0755"
  become: false
  when: scenario_runner_enabled | default(true)

- name: scenario-runner — 빌드 + 배포 (`./build-and-deploy.sh`)
  ansible.builtin.shell:
    cmd: "./build-and-deploy.sh"
    chdir: "{{ scenario_runner_install_dir }}"
  become: false
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin"
    # testbed 별 별 docker-compose project 보장 (concurrent testbed 격리)
    COMPOSE_PROJECT_NAME: "rca-scenario-runner-{{ cluster_name }}"
  when:
    - scenario_runner_enabled | default(true)
  register: runner_deploy
  changed_when: "'Recreating' in runner_deploy.stdout or 'Creating' in runner_deploy.stdout or 'Building' in runner_deploy.stdout"
  failed_when:
    # scenarios 0개여도 deploy 자체는 진행. healthz check 가 진짜 검증.
    - runner_deploy.rc != 0
    - "'No scripts found' not in runner_deploy.stdout"
    - "'No scripts found' not in runner_deploy.stderr"

- name: scenario-runner — healthz 확인
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ scenario_runner_port | default(8091) }}/healthz"
    status_code: 200
    timeout: 10
  register: runner_health
  retries: 6
  delay: 5
  until: runner_health.status == 200
  when: scenario_runner_enabled | default(true)

- name: scenario-runner — /api/scenarios 시나리오 개수 확인
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ scenario_runner_port | default(8091) }}/api/scenarios"
    status_code: 200
    timeout: 10
    return_content: true
  register: runner_scenarios
  when: scenario_runner_enabled | default(true)

- name: scenario-runner — 배포 완료 안내
  ansible.builtin.debug:
    msg: |
      rca-scenario-runner 배포 완료:
        URL:        http://{{ ansible_host }}:{{ scenario_runner_port | default(8091) }}
        scenarios:  {{ (runner_scenarios.content | from_json) | length }} 종 (yaml glob 자동 발견)
        repo:       {{ scenario_runner_install_dir }}
        branch:     {{ scenario_runner_branch | default('main') }}
  when:
    - scenario_runner_enabled | default(true)
    - runner_scenarios is defined
