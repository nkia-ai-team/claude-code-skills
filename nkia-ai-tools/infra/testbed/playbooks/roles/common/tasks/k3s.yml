---
- name: Detect K3s service status
  ansible.builtin.command: systemctl is-active k3s
  register: k3s_status
  changed_when: false
  failed_when: false

- name: Download K3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: '0755'
  register: k3s_dl
  retries: 5
  delay: 10
  until: k3s_dl is succeeded
  when: k3s_status.stdout != 'active'

- name: Install K3s
  ansible.builtin.shell: |
    INSTALL_K3S_VERSION={{ k3s_version }} \
    INSTALL_K3S_EXEC="{{ k3s_install_args }}" \
    /tmp/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  when: k3s_status.stdout != 'active'

- name: Wait for K3s API socket
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    delay: 3
    timeout: 90

- name: Wait for K3s kubeconfig
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: 60

- name: Ensure kubeconfig is world-readable
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: '0644'

- name: Wait for default ServiceAccount
  ansible.builtin.command: >
    /usr/local/bin/k3s kubectl -n default get sa default
  register: sa_check
  retries: 12
  delay: 5
  until: sa_check.rc == 0
  changed_when: false
