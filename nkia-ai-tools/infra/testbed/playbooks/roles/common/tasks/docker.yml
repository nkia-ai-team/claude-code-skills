---
- name: Detect Docker presence
  ansible.builtin.command: command -v docker
  register: docker_check
  changed_when: false
  failed_when: false

# apt-get update can be poisoned by stale third-party repos on real hosts
# (e.g. 109's expired NVIDIA workbench GPG). The CLI prints W:/E: and
# moves on; ansible.builtin.apt with update_cache=true treats the same
# state as fatal. Use a tolerant shell update + skip the in-module update
# afterwards — matches manual `apt install` behavior.
- name: Best-effort apt update (tolerate third-party repo errors)
  ansible.builtin.shell: apt-get update 2>&1 | tail -10 || true
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - docker_check.rc != 0
    - ansible_os_family == 'Debian'

- name: Install Docker prerequisites (Debian)
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, lsb-release]
    state: present
  when:
    - docker_check.rc != 0
    - ansible_os_family == 'Debian'

- name: Add Docker GPG key (Debian)
  ansible.builtin.shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg \
      -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc
  args:
    creates: /etc/apt/keyrings/docker.asc
  when:
    - docker_check.rc != 0
    - ansible_os_family == 'Debian'

- name: Add Docker apt repository (Debian)
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ target_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: false   # we update separately in a tolerant shell call
  when:
    - docker_check.rc != 0
    - ansible_os_family == 'Debian'
  register: docker_repo_added

- name: Best-effort apt update after Docker repo add (tolerate)
  ansible.builtin.shell: apt-get update 2>&1 | tail -10 || true
  args:
    executable: /bin/bash
  changed_when: false
  when: docker_repo_added is changed

- name: Install Docker engine (Debian)
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin]
    state: present
  when:
    - docker_check.rc != 0
    - ansible_os_family == 'Debian'

- name: Install Docker engine (RHEL family)
  ansible.builtin.dnf:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin]
    state: present
  when:
    - docker_check.rc != 0
    - ansible_os_family in ['RedHat', 'Rocky']

- name: Ensure /etc/docker exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'

- name: Configure Docker daemon (cgroupdriver=systemd, log rotation)
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: restart docker

- name: Enable + start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
    daemon_reload: true
