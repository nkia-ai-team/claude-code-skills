---
- name: Detect Docker presence
  ansible.builtin.command: command -v docker
  register: docker_check
  changed_when: false
  failed_when: false

- name: Install Docker prerequisites (Debian)
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, lsb-release]
    state: present
    update_cache: true
  when:
    - docker_check.rc != 0
    - ansible_os_family == 'Debian'

- name: Add Docker GPG key (Debian)
  ansible.builtin.shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg \
      -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc
  args:
    creates: /etc/apt/keyrings/docker.asc
  when:
    - docker_check.rc != 0
    - ansible_os_family == 'Debian'

- name: Add Docker apt repository (Debian)
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ target_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
  when:
    - docker_check.rc != 0
    - ansible_os_family == 'Debian'

- name: Install Docker engine (Debian)
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin]
    state: present
    update_cache: true
  when:
    - docker_check.rc != 0
    - ansible_os_family == 'Debian'

- name: Install Docker engine (RHEL family)
  ansible.builtin.dnf:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin]
    state: present
  when:
    - docker_check.rc != 0
    - ansible_os_family in ['RedHat', 'Rocky']

- name: Ensure /etc/docker exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'

- name: Configure Docker daemon (cgroupdriver=systemd, log rotation)
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: restart docker

- name: Enable + start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
    daemon_reload: true
