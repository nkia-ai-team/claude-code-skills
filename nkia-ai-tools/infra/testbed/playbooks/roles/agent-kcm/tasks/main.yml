---
- name: KCM disabled notice
  ansible.builtin.debug:
    msg: "KCM agent disabled (kcm_enabled=false)"
  when: not (kcm_enabled | default(true) | bool)

- name: AMD64 — load prebuilt KCM image
  when:
    - kcm_enabled | default(true) | bool
    - target_arch == 'amd64'
    - kcm_image_url_amd64 | length > 0
  block:
    - name: Download KCM image tarball
      ansible.builtin.get_url:
        url: "{{ kcm_image_url_amd64 }}"
        dest: /tmp/kcm-amd64.tar
        mode: '0644'
      register: kcm_dl
      retries: 5
      delay: 10
      until: kcm_dl is succeeded

    - name: Import KCM image into K3s containerd
      ansible.builtin.command: /usr/local/bin/k3s ctr -n k8s.io images import /tmp/kcm-amd64.tar
      register: kcm_import_amd
      changed_when: "'unpacked' in kcm_import_amd.stderr or 'unpacked' in kcm_import_amd.stdout"

- name: Fail fast if kcm_source_repo missing (ARM64 source-build requires it)
  ansible.builtin.fail:
    msg: |
      kcm_source_repo is required for ARM64 KCM source build but not set.
      Set via: export KCM_SOURCE_REPO=<internal gitlab url>  또는  -e kcm_source_repo=<url>
      또는 inventory vars 에 kcm_source_repo 정의.
      AMD64 prebuilt image 사용 시 kcm_enabled=true + kcm_image_url_amd64 사용 (NKIAAI-537 publish 시).
      KCM 자체 disable 시 kcm_enabled=false.
  when:
    - kcm_enabled | default(true) | bool
    - target_arch == 'arm64'
    - kcm_source_repo | default('') | length == 0

# ARM64 KCM 은 사내 GitLab (cims2.nkia.net) 의 lucida-kcmagent 소스 빌드.
# 자격증명 없거나 GitLab 도달 불가 시 ansible.builtin.git 모듈이 무한 hang
# (회고 P1 #6 — 12분+ 대기 케이스 발견). graceful skip 패턴:
#   - shallow clone (depth=1, single_branch) 으로 데이터량 최소화
#   - GIT_TERMINAL_PROMPT=0 / GIT_ASKPASS=/bin/true 로 인증 prompt 차단
#   - timeout=60 으로 hang 방지
#   - ignore_errors → kcm_clone_succeeded fact 후속 task 가 의존
#   - 실패 시 사용자에게 명확한 안내 후 KCM 외 나머지 phase 는 정상 진행
- name: ARM64 — build KCM from source (lucida-kcmagent)
  when:
    - kcm_enabled | default(true) | bool
    - target_arch == 'arm64'
    - kcm_source_repo | default('') | length > 0
  block:
    - name: Ensure source dir
      ansible.builtin.file:
        path: /opt/lucida-kcmagent
        state: directory
        mode: '0755'

    - name: Clone lucida-kcmagent (사내 GitLab — best-effort, hang 방지)
      ansible.builtin.git:
        repo: "{{ kcm_source_repo }}"
        dest: /opt/lucida-kcmagent
        version: "{{ kcm_source_branch }}"
        depth: 1
        single_branch: true
        force: false
      environment:
        GIT_TERMINAL_PROMPT: "0"
        GIT_ASKPASS: "/bin/true"
        GCM_INTERACTIVE: "Never"
      register: kcm_clone
      timeout: 60
      ignore_errors: true

    - name: Set kcm_clone_succeeded fact
      ansible.builtin.set_fact:
        kcm_clone_succeeded: "{{ kcm_clone is succeeded }}"

    - name: KCM clone 실패 안내 (사내 GitLab 자격증명 / 도달성 점검)
      ansible.builtin.debug:
        msg: |
          KCM clone 실패 — 다음 중 하나로 추정:
            - 사내 GitLab ({{ kcm_source_repo }}) 도달 불가 (VPN / 방화벽)
            - 자격증명 미설정 (clone 시 prompt 가 차단됐을 가능성)
            - 레포 경로 오타
          KCM 외 나머지 phase 는 정상 진행. KCM 필요시 사용자 직접 자격증명
          설정 후 ansible-playbook 재실행 권장.
      when: not kcm_clone_succeeded

    - name: Build kcm-agent binary (Go) on target
      ansible.builtin.command: /usr/local/bin/go build -o build/kcm-agent ./cmd/agent
      args:
        chdir: /opt/lucida-kcmagent
        creates: /opt/lucida-kcmagent/build/kcm-agent
      when: kcm_clone_succeeded

    - name: Build container image
      ansible.builtin.command: docker build -t {{ kcm_image_name }}:{{ kcm_agent_version }}-arm64 .
      args:
        chdir: /opt/lucida-kcmagent
      register: kcm_build_arm
      changed_when: "'writing image' in kcm_build_arm.stderr or 'Successfully built' in kcm_build_arm.stdout"
      when:
        - kcm_clone_succeeded
        - kcm_clone.changed or (force_rebuild | default(false))

    - name: Import KCM ARM image into K3s containerd
      ansible.builtin.shell: |
        set -o pipefail
        docker save {{ kcm_image_name }}:{{ kcm_agent_version }}-arm64 \
          | /usr/local/bin/k3s ctr -n k8s.io images import -
      args:
        executable: /bin/bash
      register: kcm_import_arm
      changed_when: "'unpacked' in kcm_import_arm.stderr or 'unpacked' in kcm_import_arm.stdout"
      when:
        - kcm_clone_succeeded
        - kcm_clone.changed or (force_rebuild | default(false))

- name: AMD64 KCM URL not configured — skip apply
  ansible.builtin.debug:
    msg: "kcm_image_url_amd64 empty — KCM AMD apply skipped. Set in group_vars/all.yml once polestar-agents-binaries asset is published."
  when:
    - kcm_enabled | default(true) | bool
    - target_arch == 'amd64'
    - kcm_image_url_amd64 | length == 0

- name: Check KCM image present in containerd
  ansible.builtin.shell: |
    /usr/local/bin/k3s ctr -n k8s.io images ls -q | grep -q "{{ kcm_image_name }}"
  register: kcm_image_present
  changed_when: false
  failed_when: false

- name: Apply KCM RBAC + DaemonSet
  when:
    - kcm_enabled | default(true) | bool
    - kcm_image_present.rc == 0
  block:
    - name: Render KCM RBAC manifest
      ansible.builtin.template:
        src: kcm-rbac.yaml.j2
        dest: /tmp/kcm-rbac.yaml
        mode: '0644'

    - name: Render KCM DaemonSet manifest
      ansible.builtin.template:
        src: kcm-daemonset.yaml.j2
        dest: /tmp/kcm-daemonset.yaml
        mode: '0644'

    - name: Diff KCM manifests against cluster state
      ansible.builtin.command: >
        /usr/local/bin/k3s kubectl diff
        --field-manager=ansible-testbed
        -f /tmp/kcm-rbac.yaml -f /tmp/kcm-daemonset.yaml
      register: kcm_diff
      changed_when: false
      failed_when: kcm_diff.rc not in [0, 1]

    - name: Apply KCM manifests (server-side, only when diff)
      ansible.builtin.command: >
        /usr/local/bin/k3s kubectl apply --server-side
        --field-manager=ansible-testbed --force-conflicts
        -f /tmp/kcm-rbac.yaml -f /tmp/kcm-daemonset.yaml
      register: kcm_apply
      changed_when: kcm_diff.rc == 1
      when: kcm_diff.rc == 1

    - name: Wait for KCM DaemonSet rollout
      ansible.builtin.command: /usr/local/bin/k3s kubectl -n kcm rollout status ds/kcm-agent --timeout=300s
      changed_when: false
