---
- name: KCM disabled notice
  ansible.builtin.debug:
    msg: "KCM agent disabled (kcm_enabled=false)"
  when: not (kcm_enabled | default(true) | bool)

- name: AMD64 — load prebuilt KCM image
  when:
    - kcm_enabled | default(true) | bool
    - target_arch == 'amd64'
    - kcm_image_url_amd64 | length > 0
  block:
    - name: Download KCM image tarball
      ansible.builtin.get_url:
        url: "{{ kcm_image_url_amd64 }}"
        dest: /tmp/kcm-amd64.tar
        mode: '0644'
      register: kcm_dl
      retries: 5
      delay: 10
      until: kcm_dl is succeeded

    - name: Import KCM image into K3s containerd
      ansible.builtin.command: /usr/local/bin/k3s ctr -n k8s.io images import /tmp/kcm-amd64.tar
      register: kcm_import_amd
      changed_when: "'unpacked' in kcm_import_amd.stderr or 'unpacked' in kcm_import_amd.stdout"

- name: Fail fast if kcm_local_path missing (ARM64 source-build requires controller-side path)
  ansible.builtin.fail:
    msg: |
      kcm_local_path 가 설정되지 않았습니다 (ARM64 KCM source build 에 필수).
      Set via: -e kcm_local_path=<absolute path on controller>
      또는 inventory host vars 에 kcm_local_path 정의.

      controller 에 lucida-kcmagent 가 없으면 testbed-build 스킬이 cwd 검색 →
      사용자 path 인터뷰 → 자동 clone (cims2.nkia.net) 단계에서 결정해야 합니다.
      AMD64 prebuilt image 사용 시 kcm_enabled=true + kcm_image_url_amd64 사용.
      KCM 자체 disable 시 kcm_enabled=false.
  when:
    - kcm_enabled | default(true) | bool
    - target_arch == 'arm64'
    - kcm_local_path | default('') | length == 0

# ARM64 KCM = 사내 GitLab (cims2.nkia.net) 의 lucida-kcmagent 소스 빌드.
# 타겟 (109 등) 에는 GitLab 자격증명이 없으므로, controller 에서 git
# 작업 + scp/rsync 로 소스 전달 → 타겟에서 build 만 수행.
#
# 흐름:
#   1. controller 에서 lucida-kcmagent 소스 확보 (kcm_local_path 변수)
#      - testbed-build 스킬이 phase 7 직전에 cwd 검색 → 없으면 사용자
#        path 받음 → 그래도 없으면 controller 에 자동 clone 후 path 결정
#      - manual ansible 실행 시: -e kcm_local_path=<absolute path> 로 전달
#   2. controller 에서 develop branch 최신화 (fetch + checkout + pull)
#   3. ansible.posix.synchronize 로 타겟 staging 에 rsync (become: false)
#   4. sudo cp 로 /opt/lucida-kcmagent 이동
#   5. 타겟에서 Go build → docker build → ctr import
- name: ARM64 — build KCM from source (controller fetch + scp 패턴)
  when:
    - kcm_enabled | default(true) | bool
    - target_arch == 'arm64'
  block:
    - name: kcm_local_path 변수 검증 — controller 의 lucida-kcmagent 소스 path
      ansible.builtin.assert:
        that:
          - kcm_local_path is defined
          - kcm_local_path | length > 0
        fail_msg: |
          kcm_local_path 가 미설정. testbed-build 스킬은 phase 7 직전에 cwd 검색
          + 사용자 path 인터뷰 + (필요 시) controller 자동 clone 으로 이 변수를
          채워야 합니다. manual ansible 실행 시:
            ansible-playbook -e kcm_local_path=/path/to/lucida-kcmagent ...

    - name: controller 에서 lucida-kcmagent .git 존재 확인
      delegate_to: localhost
      become: false
      ansible.builtin.stat:
        path: "{{ kcm_local_path }}/.git"
      register: kcm_local_git_stat

    - name: controller 의 path 가 git repo 가 아니면 fail-fast
      ansible.builtin.fail:
        msg: |
          {{ kcm_local_path }} 에 .git 이 없음. testbed-build 스킬이 cwd 검색 / 사용자
          path / 자동 clone 단계에서 잘못된 경로를 결정했거나, manual ansible 호출
          시 사용자가 잘못된 -e kcm_local_path 를 줬습니다.
      when: not kcm_local_git_stat.stat.exists

    - name: controller 에서 develop branch 최신화 (fetch + checkout + pull)
      delegate_to: localhost
      become: false
      ansible.builtin.shell: |
        set -e
        cd "{{ kcm_local_path }}"
        git fetch --quiet origin
        git checkout --quiet "{{ kcm_source_branch | default('develop') }}"
        git pull --ff-only --quiet origin "{{ kcm_source_branch | default('develop') }}"
      changed_when: false

    - name: 타겟 의 staging dir 준비
      become: false
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kcm-staging"
        state: directory
        mode: '0755'

    - name: lucida-kcmagent 소스 controller → target rsync (no sudo, hang 방지)
      become: false
      ansible.posix.synchronize:
        src: "{{ kcm_local_path }}/"
        dest: "/home/{{ ansible_user }}/.kcm-staging/lucida-kcmagent/"
        delete: true
        rsync_opts:
          - "--exclude=.git"

    - name: /opt/lucida-kcmagent 으로 sudo cp 이동
      ansible.builtin.shell: |
        set -e
        rm -rf /opt/lucida-kcmagent
        cp -a "/home/{{ ansible_user }}/.kcm-staging/lucida-kcmagent" /opt/lucida-kcmagent
        chown -R root:root /opt/lucida-kcmagent
      changed_when: true

    # host go build task 제거 — Dockerfile multi-stage (golang build-stage) 가 binary 생성
    # 책임. 별도 host build 는 redundant + ./cmd/agent 디렉토리 자체가 develop 구조에 없음
    # (실제: cmd/master/, cmd/node/, root main.go).

    - name: Build container image
      ansible.builtin.command: docker build -t {{ kcm_image_name }}:{{ kcm_agent_version }}-arm64 .
      args:
        chdir: /opt/lucida-kcmagent
      register: kcm_build_arm
      changed_when: "'writing image' in kcm_build_arm.stderr or 'Successfully built' in kcm_build_arm.stdout"

    - name: Import KCM ARM image into K3s containerd
      ansible.builtin.shell: |
        set -o pipefail
        docker save {{ kcm_image_name }}:{{ kcm_agent_version }}-arm64 \
          | /usr/local/bin/k3s ctr -n k8s.io images import -
      args:
        executable: /bin/bash
      register: kcm_import_arm
      changed_when: "'unpacked' in kcm_import_arm.stderr or 'unpacked' in kcm_import_arm.stdout"

- name: AMD64 KCM URL not configured — skip apply
  ansible.builtin.debug:
    msg: "kcm_image_url_amd64 empty — KCM AMD apply skipped. Set in group_vars/all.yml once polestar-agents-binaries asset is published."
  when:
    - kcm_enabled | default(true) | bool
    - target_arch == 'amd64'
    - kcm_image_url_amd64 | length == 0

- name: Check KCM image present in containerd
  ansible.builtin.shell: |
    /usr/local/bin/k3s ctr -n k8s.io images ls -q | grep -q "{{ kcm_image_name }}"
  register: kcm_image_present
  changed_when: false
  failed_when: false

# ⚠️ TODO (NKIAAI-542 follow-up) — KCM master 배포 누락
# KCM 아키텍처 = master (NATS server + collector) + per-node agents (DaemonSet).
# 현재 본 role 은 node agent (DaemonSet) 만 배포. master 가 없어서 node agent 가
# nats://master 연결 실패 → standby 미감지 → Polestar10 에 자원 자동 등록 X.
#
# 정확한 fix 는 lucida-kcmagent 의 master 컴포넌트 build + K8s Deployment + Service
# (NATS port 4222 expose) manifest 추가. follow-up issue 에서 처리.

- name: Apply KCM RBAC + DaemonSet
  when:
    - kcm_enabled | default(true) | bool
    - kcm_image_present.rc == 0
  block:
    - name: Ensure kcm namespace exists (kubectl diff chicken-and-egg fix)
      # kubectl diff 가 신규 namespace 부재 시 rc=2 (namespace not found) 로 fail.
      # apply 직전에 ns 를 미리 만들어 두면 diff 도 정상 동작.
      ansible.builtin.command: /usr/local/bin/k3s kubectl create namespace kcm
      register: kcm_ns_create
      changed_when: kcm_ns_create.rc == 0
      failed_when:
        - kcm_ns_create.rc != 0
        - "'AlreadyExists' not in kcm_ns_create.stderr"

    - name: Render KCM RBAC manifest
      ansible.builtin.template:
        src: kcm-rbac.yaml.j2
        dest: /tmp/kcm-rbac.yaml
        mode: '0644'

    - name: Render KCM DaemonSet manifest
      ansible.builtin.template:
        src: kcm-daemonset.yaml.j2
        dest: /tmp/kcm-daemonset.yaml
        mode: '0644'

    - name: Diff KCM manifests against cluster state
      ansible.builtin.command: >
        /usr/local/bin/k3s kubectl diff
        --field-manager=ansible-testbed
        -f /tmp/kcm-rbac.yaml -f /tmp/kcm-daemonset.yaml
      register: kcm_diff
      changed_when: false
      failed_when: kcm_diff.rc not in [0, 1]

    - name: Apply KCM manifests (server-side, only when diff)
      ansible.builtin.command: >
        /usr/local/bin/k3s kubectl apply --server-side
        --field-manager=ansible-testbed --force-conflicts
        -f /tmp/kcm-rbac.yaml -f /tmp/kcm-daemonset.yaml
      register: kcm_apply
      changed_when: kcm_diff.rc == 1
      when: kcm_diff.rc == 1

    - name: Wait for KCM DaemonSet rollout
      ansible.builtin.command: /usr/local/bin/k3s kubectl -n kcm rollout status ds/kcm-agent --timeout=300s
      changed_when: false
