---
- name: Ensure app source dir exists
  ansible.builtin.file:
    path: "/opt/{{ app_namespace }}"
    state: directory
    mode: '0755'

- name: Clone application repository
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "/opt/{{ app_namespace }}/src"
    version: "{{ app_version }}"
    force: false
  register: git_clone

- name: Check if app image already in K3s containerd
  ansible.builtin.command: /usr/local/bin/k3s ctr -n k8s.io images ls -q
  register: ctr_images
  changed_when: false
  failed_when: false

- name: Build + import app image
  when: >
    git_clone.changed or
    force_rebuild | default(false) or
    (app_image_tag not in (ctr_images.stdout | default('')))
  block:
    - name: Build app container image (target host)
      ansible.builtin.command: docker build -t {{ app_image_tag }} .
      args:
        chdir: "/opt/{{ app_namespace }}/src"
      register: app_build

    - name: Import app image into K3s containerd (k8s.io namespace)
      ansible.builtin.shell: |
        set -o pipefail
        docker save {{ app_image_tag }} | /usr/local/bin/k3s ctr -n k8s.io images import -
      args:
        executable: /bin/bash
      register: app_import
      changed_when: "'unpacked' in app_import.stderr or 'unpacked' in app_import.stdout"

- name: Render application manifest
  ansible.builtin.template:
    src: app-manifests.yaml.j2
    dest: "/tmp/app-{{ app_namespace }}.yaml"
    mode: '0644'

- name: Apply application manifest (server-side)
  ansible.builtin.command: >
    /usr/local/bin/k3s kubectl apply --server-side
    --field-manager=ansible-testbed --force-conflicts
    -f /tmp/app-{{ app_namespace }}.yaml
  register: app_apply
  changed_when: app_apply.stdout_lines | select | reject('search', 'unchanged') | list | length > 0

- name: Wait for app deployment availability
  ansible.builtin.command: >
    /usr/local/bin/k3s kubectl wait --for=condition=Available
    deployment/app -n {{ app_namespace }} --timeout=300s
  changed_when: false
