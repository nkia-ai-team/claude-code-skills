---
- name: Ensure git installed
  ansible.builtin.package:
    name: git
    state: present

- name: Ensure source dir parent
  ansible.builtin.file:
    path: "/opt/{{ app_namespace }}"
    state: directory
    mode: '0755'

- name: Clone testbed-services monorepo
  ansible.builtin.git:
    repo: >-
      {%- if github_pat | length > 0 and app_repo is match('^https://') -%}
      {{ app_repo | regex_replace('^https://', 'https://oauth2:' ~ github_pat ~ '@') }}
      {%- else -%}
      {{ app_repo }}
      {%- endif -%}
    dest: "/opt/{{ app_namespace }}/src"
    version: "{{ app_version }}"
    force: false
  environment:
    # Prevent git from prompting for credentials when PAT-less / wrong PAT —
    # otherwise ansible.git hangs forever.
    GIT_TERMINAL_PROMPT: "0"
    GIT_ASKPASS: "/bin/true"
  register: app_clone
  no_log: true

- name: Stat build-and-deploy.sh
  ansible.builtin.stat:
    path: "/opt/{{ app_namespace }}/src/{{ app_subdir }}/k8s/build-and-deploy.sh"
  register: bds_stat

- name: Fail when build-and-deploy.sh is missing
  ansible.builtin.fail:
    msg: |
      Expected {{ app_subdir }}/k8s/build-and-deploy.sh in {{ app_repo }} but not found.
      testbed-services monorepo standard requires this script (NKIAAI-570).
  when: not bds_stat.stat.exists

- name: Run build-and-deploy.sh (5 service docker build + ctr import + kubectl apply)
  ansible.builtin.shell: bash k8s/build-and-deploy.sh
  args:
    chdir: "/opt/{{ app_namespace }}/src/{{ app_subdir }}"
    executable: /bin/bash
  register: bds_run
  changed_when: bds_run.rc == 0
  when: bds_stat.stat.exists

- name: Wait for all testbed deployments to be Available
  ansible.builtin.command: >
    /usr/local/bin/k3s kubectl -n {{ app_namespace }}
    rollout status deployment --timeout=300s
  changed_when: false
  failed_when: false

- name: Wait for all testbed statefulsets to be ready
  ansible.builtin.command: >
    /usr/local/bin/k3s kubectl -n {{ app_namespace }}
    rollout status statefulset --timeout=180s
  changed_when: false
  failed_when: false
