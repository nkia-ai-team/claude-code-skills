---
- name: Ensure git installed
  ansible.builtin.package:
    name: git
    state: present

- name: Ensure source dir parent
  ansible.builtin.file:
    path: "/opt/{{ app_namespace }}"
    state: directory
    mode: '0755'

# testbed-services 는 public 레포 (NKIAAI-542 결정). PAT/자격증명 불필요.
# private 환경에서 운영하려는 사용자는 inventory 의 `app_repo` 를
# `https://<user>:<pat>@github.com/...` 형식으로 직접 지정 (사용자 책임).
- name: Clone or update testbed-services monorepo (public)
  ansible.builtin.shell: |
    set -eu
    SRC="/opt/{{ app_namespace }}/src"
    if [ -d "${SRC}/.git" ]; then
      OLD=$(git -C "${SRC}" rev-parse HEAD 2>/dev/null || echo none)
      git -C "${SRC}" fetch --quiet origin {{ app_version }}
      git -C "${SRC}" checkout --quiet {{ app_version }}
      git -C "${SRC}" reset --hard --quiet FETCH_HEAD
      NEW=$(git -C "${SRC}" rev-parse HEAD)
      [ "${OLD}" = "${NEW}" ] && echo UNCHANGED || echo "UPDATED ${OLD} -> ${NEW}"
    else
      git clone --quiet --branch {{ app_version }} {{ app_repo }} "${SRC}"
      echo "CLONED $(git -C ${SRC} rev-parse HEAD)"
    fi
  args:
    executable: /bin/bash
  environment:
    # 인증 prompt 가 hang 시키지 않도록 안전망. public 이라 정상 케이스엔 무관.
    GIT_TERMINAL_PROMPT: "0"
    GIT_ASKPASS: "/bin/true"
  register: app_clone
  changed_when: "'CLONED' in (app_clone.stdout | default('')) or 'UPDATED' in (app_clone.stdout | default(''))"

- name: Stat build-and-deploy.sh
  ansible.builtin.stat:
    path: "/opt/{{ app_namespace }}/src/{{ app_subdir }}/k8s/build-and-deploy.sh"
  register: bds_stat

- name: Fail when build-and-deploy.sh is missing
  ansible.builtin.fail:
    msg: |
      Expected {{ app_subdir }}/k8s/build-and-deploy.sh in {{ app_repo }} but not found.
      testbed-services monorepo standard requires this script (NKIAAI-570).
  when: not bds_stat.stat.exists

# 멱등성 — 같은 repo rev 가 이미 deploy 됐으면 build-and-deploy.sh 재실행 skip.
# rev sentinel 을 /opt/<ns>/.applied_rev 에 보관. testbed-build 스킬 호출 시
# 매번 changed=1 보고하던 노이즈 제거 + ARM 빌드 시간 절약.
- name: Get current repo rev
  ansible.builtin.command: git -C /opt/{{ app_namespace }}/src rev-parse HEAD
  register: current_rev
  changed_when: false

- name: Read previously-applied repo rev sentinel
  ansible.builtin.slurp:
    src: "/opt/{{ app_namespace }}/.applied_rev"
  register: applied_rev_b64
  failed_when: false

- name: Set applied_rev fact
  ansible.builtin.set_fact:
    applied_rev: "{{ (applied_rev_b64.content | b64decode | trim) if (applied_rev_b64 is not failed and applied_rev_b64.content is defined) else '' }}"

# envsubst 가 build-and-deploy.sh 의 매니페스트 placeholder (${OTLP_ENDPOINT}) 치환에 필요.
# Ubuntu/Debian 면 보통 기본 깔려있지만 minimal 이미지/일부 ARM 환경에서 부재 가능 — 보장.
- name: Ensure envsubst (gettext-base) installed for manifest placeholder substitution
  ansible.builtin.package:
    name: gettext-base
    state: present
  become: true
  when: ansible_facts.os_family in ['Debian', 'RedHat']

# build-and-deploy.sh 가 docker build + kubectl apply 호출. testbed 별 cluster 의
# KUBECONFIG 명시 필수 (cluster_kind=k3d 면 testbed-별 kubeconfig_path).
# OTLP_ENDPOINT — APM(OTel) collector 주소를 deploy-time 에 매니페스트에 주입. 신규 testbed 의
# build-and-deploy.sh 가 envsubst 로 치환 (services-author-task.md § 매니페스트 치환 패턴).
# 기존 plopvape-shop (envsubst 미적용 매니페스트) 도 호환 — env 무시하고 그대로 apply.
- name: Run build-and-deploy.sh (only when repo rev changed or first run)
  ansible.builtin.shell: bash k8s/build-and-deploy.sh
  args:
    chdir: "/opt/{{ app_namespace }}/src/{{ app_subdir }}"
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    OTLP_ENDPOINT: "http://{{ polestar10_collector_host }}:{{ polestar10_apm_otlp_port | default(6565) }}"
    POLESTAR_ORG_ID: "{{ polestar_organization_id }}"
  register: bds_run
  changed_when: bds_run.rc == 0
  when:
    - bds_stat.stat.exists
    - applied_rev != current_rev.stdout

# k3d 의 경우: build-and-deploy.sh 가 docker build 한 image 를 k3d cluster 에 import 해야.
# 기존 native K3s 는 docker engine 의 이미지가 그대로 K3s 컨테이너로 사용 가능했지만 (host docker = K3s containerd 공유 setting),
# k3d 는 별 컨테이너 안 K3s 라 docker host image → k3d cluster import 명시 필요.
- name: Import service images into k3d cluster (k3d only)
  ansible.builtin.shell: |
    set -e
    # build-and-deploy.sh 가 빌드한 이미지 list 추출 후 k3d 로 import
    cd /opt/{{ app_namespace }}/src/{{ app_subdir }}
    if [ -f k8s/build-and-deploy.sh ]; then
      # docker images 의 testbed 관련 image 자동 발견 (last 1h 빌드 + app_subdir prefix 또는 namespace prefix)
      IMAGES=$(docker images --format '{{ "{{.Repository}}:{{.Tag}}" }}' | grep -E "^({{ app_subdir }}|{{ app_namespace }})" | head -20)
      if [ -n "$IMAGES" ]; then
        echo "$IMAGES" | while read img; do
          k3d image import "$img" -c "{{ cluster_name }}"
        done
      else
        echo "no matching local images for k3d import — service images 가 정상이라면 image: 의 registry pull 패턴"
      fi
    fi
  when:
    - cluster_kind | default('k3d') == 'k3d'
    - bds_run is changed
  register: k3d_image_import
  changed_when: k3d_image_import.rc == 0
  failed_when: false

- name: Persist applied rev sentinel
  ansible.builtin.copy:
    content: "{{ current_rev.stdout }}"
    dest: "/opt/{{ app_namespace }}/.applied_rev"
    mode: '0644'
  when: bds_run is changed

- name: Wait for all testbed deployments to be Available
  ansible.builtin.command: >
    kubectl -n {{ app_namespace }}
    rollout status deployment --timeout=300s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false

- name: Wait for all testbed statefulsets to be ready
  ansible.builtin.command: >
    kubectl -n {{ app_namespace }}
    rollout status statefulset --timeout=180s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false
