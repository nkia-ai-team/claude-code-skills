---
# Inventory sample 의 connection 변수 (TESTBED_HOST/USER/PASSWORD/...) 가
# 누락되면 SSH 시도 시점에 cryptic 한 에러가 나기 전에 명확한 메시지 출력.
# testbed-build 스킬은 인터뷰 후 동적 inventory 를 생성하므로 통과,
# 수동 ansible-playbook 실행 시 사용자에게 가이드 역할.
- name: Pre-flight env vars + polestar10 connectivity check
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Validate required env vars (sample inventory 사용 시)
      ansible.builtin.assert:
        that:
          - lookup('env', 'TESTBED_HOST') | length > 0
          - lookup('env', 'TESTBED_USER') | length > 0
        fail_msg: |
          Required environment variables not set.
          ansible-playbook 직접 실행 시 다음을 export 하거나 testbed-build
          스킬을 사용하세요:
            export TESTBED_HOST=<target ip>            # 필수
            export TESTBED_USER=<ssh user>             # 필수
            export TESTBED_PASSWORD=<password>         # ssh key 미사용 시
            export TESTBED_BECOME_PASSWORD=<sudo pw>   # 미설정 시 PASSWORD 재사용
            export TESTBED_SSH_KEY=<keypath>           # password 대안
            export POLESTAR_ORG_ID=<24-hex tenant>     # SMS install 필수
            export GITHUB_PAT=<token>                  # private repo asset
        success_msg: "Connection env vars present (host={{ lookup('env', 'TESTBED_HOST') }}, user={{ lookup('env', 'TESTBED_USER') }})"
      when: lookup('env', 'TESTBED_HOST_SKIP_CHECK') | default('') | length == 0

    # Polestar10 controller-side reachability — POLESTAR10_BASE_URL 가 설정된 경우만 검사.
    # SMS 설치 (POLESTAR_ORG_ID 사용) + agent install 단계에서 Polestar10 도달 필수.
    # 미설정이면 사용자가 testbed-build 스킬 외부에서 ansible 만 돌리는 케이스로 간주, skip.
    # Reachability 만 검사 — Polestar10 서버 버전마다 auth path 가 다를 수 있음 (예: 96 데모 = /api/sso/preLogin,
    # 104 운영 = /api/account/pre-login). 실제 auth 검증은 testbed-polestar10-register 의 login.md recipe 가 처리.
    # 본 task 는 "controller → polestar10 host 도달 가능?" 만 확인.
    - name: Polestar10 reachability precheck (root URL, when POLESTAR10_BASE_URL set)
      ansible.builtin.uri:
        url: "{{ lookup('env', 'POLESTAR10_BASE_URL') }}/"
        method: GET
        validate_certs: false
        status_code: [200, 301, 302, 303, 307, 308, 401, 403, 404]
        timeout: 10
      when:
        - lookup('env', 'POLESTAR10_BASE_URL') | length > 0
        - lookup('env', 'TESTBED_POLESTAR10_SKIP_CHECK') | default('') | length == 0
      register: polestar10_precheck
      ignore_errors: true

    - name: Fail with guidance if polestar10 precheck failed
      ansible.builtin.fail:
        msg: |
          Polestar10 도달 불가 — 다음을 점검하세요:
            - {{ lookup('env', 'POLESTAR10_BASE_URL') }} 가 정상 동작 중인지 확인
            - controller → Polestar10 네트워크 (방화벽 / VPN / DNS) 점검
            - bootstrap.yaml 또는 export 한 POLESTAR10_BASE_URL 오타 확인
            - skip 하려면 export TESTBED_POLESTAR10_SKIP_CHECK=1
      when:
        - polestar10_precheck is defined
        - polestar10_precheck.failed | default(false)

    # group_vars/all.yml 의 polestar10_collector_host 가 RFC5737 placeholder 그대로
    # 흘러가는 걸 차단. inventory host_vars 또는 -e 로 실제 값 (사내 내부 IP 권장) 박아야 함.
    # placeholder 그대로면 모든 agent (WPM/APM/SMS/KCM) 가 unroutable 한 198.51.100.104
    # 로 패킷 송신하다 silently fail.
    - name: Assert polestar10_collector_host overridden (placeholder block)
      ansible.builtin.assert:
        that:
          - polestar10_collector_host is defined
          - polestar10_collector_host != "198.51.100.104"
        fail_msg: |
          polestar10_collector_host 가 RFC5737 placeholder (198.51.100.104) 그대로입니다.
          inventory host_vars 또는 -e 로 실제 collector IP 를 박으세요:
            -e polestar10_collector_host=<실제 IP>
          사내 NAT/방화벽 환경이면 public IP 가 아닌 사내 내부 IP 권장.
          (testbed-build 스킬은 bootstrap.yaml 의 polestar10.collector_host 를 inventory
           host_vars 로 자동 주입 — 빠지면 본 assert 가 fail-fast)
        success_msg: "polestar10_collector_host = {{ polestar10_collector_host }}"
      vars:
        polestar10_collector_host: "{{ hostvars[groups['testbed'][0]]['polestar10_collector_host'] | default('198.51.100.104') }}"
      when: groups['testbed'] is defined and groups['testbed'] | length > 0

- name: RCA Testbed bootstrap — common stack + agents + service
  hosts: testbed
  become: true
  gather_facts: true
  vars:
    target_arch: "{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}"
  pre_tasks:
    - name: Pre-flight OS check (Linux + systemd required)
      ansible.builtin.assert:
        that:
          - ansible_system == 'Linux'
          - ansible_os_family in ['Debian', 'RedHat', 'Rocky']
          - ansible_service_mgr == 'systemd'
        fail_msg: |
          Target {{ inventory_hostname }} is not Linux+systemd.
          Got system={{ ansible_system }}, os_family={{ ansible_os_family }}, service_mgr={{ ansible_service_mgr }}.
          Supported: Ubuntu 22.04+/Debian 12+/RHEL/Rocky 9+ with systemd.
    - name: Echo target architecture
      ansible.builtin.debug:
        msg: "Target arch: {{ target_arch }} (ansible_architecture={{ ansible_architecture }}, os={{ ansible_distribution }} {{ ansible_distribution_version }})"
  # Role order rationale:
  #   1. common — Docker / k3d (또는 native K3s legacy) / firewall / Go (ARM)
  #   2. agent-wpm, agent-apm — JVM agent jars must exist on host BEFORE service-k8s mounts them
  #   3. cluster-manager — testbed 별 별 K8s cluster 생성 (k3d) + KUBECONFIG export + metrics-server
  #   4. service-k8s — Spring boot + DB; mounts wpm/apm jars via hostPath; KUBECONFIG=testbed cluster
  #   5. agent-kcm — helm chart 로 master + node 배포 (testbed 별 cluster 안)
  #   6. agent-sms — host-level systemd; independent of K8s
  #   7. scenario-runner — RCA 장애 시나리오 실행 웹 서비스 (docker-compose), testbed 별 별 인스턴스
  # SoT 10-step view orders agents AFTER service deploy. Implementation order differs for technical reasons (mount sequencing).
  roles:
    - role: common
      tags: [common]
    - role: agent-wpm
      tags: [agents, wpm]
    - role: agent-apm
      tags: [agents, apm]
    - role: cluster-manager
      tags: [cluster]
    - role: service-k8s
      tags: [service]
    - role: agent-kcm
      tags: [agents, kcm]
    - role: agent-sms
      tags: [agents, sms]
    - role: scenario-runner
      tags: [scenario-runner]
      when: scenario_runner_enabled | default(true)
