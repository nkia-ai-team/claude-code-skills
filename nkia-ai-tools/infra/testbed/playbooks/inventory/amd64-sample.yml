---
# AMD64 검증용 inventory 샘플
# 사용 예: ansible-playbook -i inventory/amd64-sample.yml site.yml
#
# 보안 주의: ansible_password 평문 대신 ssh key 또는 ansible-vault 사용 권장
all:
  children:
    testbed:
      hosts:
        amd64-target:
          ansible_host: 192.168.230.XXX     # ← 검증 타겟 IP 채워 넣기
          ansible_user: sjbang
          ansible_python_interpreter: /usr/bin/python3
      vars:
        # testbed-services monorepo (NKIAAI-570) — k8s/build-and-deploy.sh 가 5 service build + apply
        app_repo: "https://github.com/BangSungjoon/plopvape-shop"
        app_version: main
        app_namespace: rca-testbed
