---
# ARM64 검증용 inventory 샘플 — DGX Spark (109)
# 사용 예: ansible-playbook -i inventory/arm64-sample.yml site.yml
#
# 보안 주의: ansible_password 평문 대신 ansible-vault 사용 권장
#   ansible-vault encrypt_string '<REDACTED-SSH-PASSWORD>' --name 'ansible_password' > vault.yml
all:
  children:
    testbed:
      hosts:
        arm64-target:
          ansible_host: <TARGET-HOST>
          ansible_user: nkia
          ansible_password: <REDACTED-SSH-PASSWORD>
          ansible_become_password: <REDACTED-SSH-PASSWORD>
          ansible_python_interpreter: /usr/bin/python3
      vars:
        db_engine: postgres
        app_repo: "https://github.com/BangSungjoon/plopvape-shop"
        app_version: main
        app_nodeport: 30080
