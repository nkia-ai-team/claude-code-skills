---
# ARM64 검증용 inventory 샘플 — DGX Spark (109)
# 사용 예: ansible-playbook -i inventory/arm64-sample.yml site.yml
#
# 보안 주의: ansible_password 평문 대신 ansible-vault 사용 권장
all:
  children:
    testbed:
      hosts:
        arm64-target:
          ansible_host: <TARGET-HOST>
          ansible_user: nkia
          ansible_password: <REDACTED-SSH-PASSWORD>
          ansible_become_password: <REDACTED-SSH-PASSWORD>
          ansible_python_interpreter: /usr/bin/python3
      vars:
        # testbed-services monorepo (NKIAAI-570) — <app_subdir>/k8s/build-and-deploy.sh 가 5 service build + apply
        app_repo: "https://github.com/nkia-ai-team/testbed-services"
        app_version: main
        app_subdir: plopvape-shop
        app_namespace: rca-testbed
