agent: wpm
versions:
  - version: "TBD"
    release_date: "TBD"
arch_support:
  amd64:
    method: native
    asset_url: "TBD"
  arm64:
    method: native
    asset_url: "TBD"
detection_command: "ps -ef | grep -i 'javaagent.*wpm' | grep -v grep"
prerequisites:
  - "Java 8/11/17 runtime (Java 21 is unsupported — see install-guide.md)"
  - "Write access to Tomcat JAVA_OPTS / CATALINA_OPTS"
